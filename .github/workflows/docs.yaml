name: Docs
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "book.toml"
      # The option reference is generated from the module.
      - "modules/**"
      - "packages/docs.nix"
      - "packages/docs-reference.nix"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Build the site
        run: nix build -L .#docs && cp -rL result site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
