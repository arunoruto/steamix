name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: nixfmt
        run: nix fmt -- --ci

  # Every output of every system evaluates: aarch64 included (the handheld
  # modules and images), which nothing else here builds.
  eval:
    name: flake check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: nix flake check, evaluation only
        run: nix flake check --no-build --all-systems

  vm-test:
    name: ${{ matrix.test }} (${{ matrix.channel.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One failing test or channel must not hide the others: the two
      # channels have already disagreed about greetd's PAM stack.
      fail-fast: false
      matrix:
        test: [greetd, sddm, steamos-manager, decky-loader, library, emulation, options, decky-lsfg-vk, rocknix-abl, linux-armada-config]
        # unstable: nixos-unstable at the revision flake.lock pins.
        # stable: the current nixos-26.05 channel head, so a release-branch
        #   change that breaks Steamix shows up without waiting for a lock
        #   bump.
        channel:
          - { name: unstable, args: "" }
          - { name: stable, args: "--no-write-lock-file --override-input nixpkgs github:nixos/nixpkgs/nixos-26.05" }
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Hands the runner's /dev/kvm to the Nix daemon; without it the
          # test driver falls back to emulation and takes many times longer.
          kvm: true
      - name: Pull from the Steamix cache
        uses: cachix/cachix-action@v17
        with:
          name: steamix
          # Tests never push; the cache workflow does, after they pass.
          skipPush: true
      - name: Run ${{ matrix.test }} against ${{ matrix.channel.name }}
        run: nix build -L ${{ matrix.channel.args }} .#checks.x86_64-linux.${{ matrix.test }}

  # The Retroid Pocket 6 bring-up image, built natively and booted in QEMU
  # (emulated: GitHub's ARM runners have no KVM). The kernel comes from the
  # cache, or is built here (about 45 minutes) when it changed.
  handheld-boot:
    name: boot retroid-pocket-6 (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Pull from the Steamix cache
        uses: cachix/cachix-action@v17
        with:
          name: steamix
          skipPush: true
      - name: Build the image and boot it
        run: nix build -L .#checks.aarch64-linux.boot-retroid-pocket-6

  cache:
    name: cache
    needs: [format, eval, vm-test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cache.yaml
    secrets: inherit
